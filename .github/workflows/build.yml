# Build check, shared: ci.yml and release.yml both call this, so CI verifies the exact
# build a release ships.
name: build

on:
  workflow_call:

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { enable-cache: true }
      - name: Build check (wheel + sdist from the locked environment)
        run: uv build
      - name: The wheel installs and the CLI starts
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check dist/*.whl
          /tmp/wheel-check/bin/worshipdeck --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: dist, path: dist/ }
