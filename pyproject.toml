[project]
name = "worshipdeck"
version = "0.1.0"
description = "Sunday-service PPTX from a flyer image: OCR the song list, pull hymns from the himnario, clone the church's slide style."
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "pypdf>=6.0.0",
    "reportlab>=4.0",
    "pillow>=12.3.0",
    "flask>=3.1.3",
]

[project.scripts]
worshipdeck = "worshipdeck.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.16"]

# Static testing: three buckets (bug / error / style), bugs first.
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    # bug: changes behavior
    "F", "E9", "B", "PLE",
    # error: same behavior, worse to maintain
    "PLW", "RUF",
    # style
    "I", "E4", "E7", "SIM",
]
ignore = [
    "PLW2901",  # rebinding a loop variable (line = line.strip()) is the idiom in the parsers
    "PLW0603",  # module-level caches
    "E741",     # `l` for a line/layout in short comprehensions
    "RUF001", "RUF002", "RUF003",  # Spanish text: «», –, · are intended characters
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: crosses modules or touches real files/tools (the Trophy's cup)",
    "e2e: runs the installed CLI as a subprocess, like a user",
    "slow: over 10 s (LibreOffice render); off locally, on in CI's e2e job",
]
addopts = "-ra -m 'not slow'"
